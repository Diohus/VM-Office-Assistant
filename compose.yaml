# Chạy: sh tools/dev/up.sh (xem docs/engineering/run.md)
# Chỉ web có đường ra ngoài và chỉ mở trên 127.0.0.1. API và Postgres ở mạng nội bộ, reader không có mạng.
name: vm-office

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs: ["/tmp:size=64m,uid=1000,gid=1000"]

secrets:
  machine_ca:
    file: .local/machine-ca.pem

services:
  web:
    <<: *hardened
    build:
      context: .
      dockerfile: frontend/Dockerfile
      secrets: [machine_ca]
    tmpfs: ["/tmp:size=64m,uid=101,gid=101"]
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    networks: [edge, internal]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    pids_limit: 64

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets: [machine_ca]
    environment:
      DATABASE_URL: postgresql://vm:${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD}@db:5432/vm
    volumes: ["store:/store", "spool:/spool", "lospool:/lospool"]
    networks: [internal]
    depends_on: [db, reader]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    pids_limit: 128

  reader:
    <<: *hardened
    build:
      context: .
      dockerfile: workers/reader/Dockerfile
      secrets: [machine_ca]
    network_mode: none
    volumes: ["spool:/spool"]
    mem_limit: 4g
    pids_limit: 64

  converter:
    <<: *hardened
    build:
      context: .
      dockerfile: workers/libreoffice/Dockerfile
    network_mode: none
    tmpfs: ["/tmp:size=512m,uid=1000,gid=1000", "/home/lo:size=64m,uid=1000,gid=1000"]
    volumes: ["lospool:/spool"]
    mem_limit: 2g
    pids_limit: 256

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: vm
      POSTGRES_DB: vm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    networks: [internal]
    mem_limit: 1g

networks:
  edge: {}
  internal:
    internal: true

volumes:
  store: {}
  spool: {}
  lospool: {}
  db: {}
