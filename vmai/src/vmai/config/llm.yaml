# Đổi provider, model bằng file này hoặc biến môi trường VMAI_LLM_PROFILE.
# Khả năng: "yes", "no", hoặc "unverified". unverified bị chặn như no cho tới khi xác minh.
active: openai-luna

profiles:
  openai-luna:
    provider: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    # Giá từ developers.openai.com/api/docs/pricing, bậc Standard, đọc ngày 04/11/2026.
    budget:
      max_tokens_per_run: 200000
      max_usd_per_run: 1.0
      price: {input_per_mtok: 0.10, output_per_mtok: 0.50, as_of: "2026-11-04", source: "developers.openai.com/api/docs/pricing"}
    # Đã qua verify_model.py ngày 04/11/2026 trên dữ liệu giả.
    capabilities:
      image_input: "yes"
      tool_calls: "yes"
      structured_output: "yes"

  claude:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    budget: {max_tokens_per_run: 200000, max_usd_per_run: 1.0}
    capabilities:
      # Tài liệu hãng có các khả năng này, nhưng chưa gọi thử trong dự án.
      image_input: unverified
      tool_calls: unverified
      structured_output: unverified

  openrouter:
    provider: openrouter
    # PM chốt đúng một ID, không dùng tự chọn. Để trống thì load_profile báo lỗi.
    model: null
    api_key_env: OPENROUTER_API_KEY
    budget: {max_tokens_per_run: 200000, max_usd_per_run: 1.0}
    # Mặc định trong code: allow_fallbacks false, data_collection deny, require_parameters true.
    # Model miễn phí có thể giữ dữ liệu. Không dùng với dữ liệu thật (Q55).
    routing: {}
    capabilities:
      image_input: unverified
      tool_calls: unverified
      structured_output: unverified

  fake:
    provider: fake
    model: fake-1
    capabilities:
      image_input: "yes"
      tool_calls: "yes"
      structured_output: "yes"
