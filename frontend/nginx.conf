server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 26m;

    # Chặn mọi nguồn ngoài, để không phụ thuộc vào việc thư viện lưới có gọi ra ngoài hay không.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # Phân giải lại tên mỗi lần, vì API khởi động lại có thể đổi địa chỉ. API tắt thì báo ngay, không để người dùng chờ.
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_connect_timeout 3s;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        error_page 413 = @too_large;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"code":"FILE_TOO_LARGE","message":"File vượt giới hạn 25 MB nên app không mở. File của bạn không bị đổi. Hãy tách file hoặc hỏi người quản lý app.","detail":{"limit":"file"}}';
    }

    location / {
        try_files $uri /index.html;
    }
}
